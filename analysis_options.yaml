# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

# Per FLUTTER_ARCHITECTURE.md §15's architecture-test intent: the analyzer
# itself is configured as strictly as the language allows, so a whole class
# of "quietly wrong" code (implicit dynamic, unchecked casts, raw generic
# types) fails analysis rather than passing review by omission.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  # Layered on top of package:flutter_lints — deliberately not a second,
  # competing lint package (e.g. very_good_analysis); every rule below is
  # enabled individually so the reasoning for each is inspectable, per
  # this phase's "explain every dependency/decision" instruction.
  rules:
    # Import discipline — relative imports within lib/, consistent with
    # every file in this codebase (see FLUTTER_ARCHITECTURE.md §2).
    - prefer_relative_imports
    - directives_ordering

    # Immutability and const-correctness — cheap to enforce, meaningfully
    # reduces rebuild cost across the widget tree.
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_final_fields
    - avoid_redundant_argument_values

    # Modern Dart idiom.
    - use_super_parameters
    - unnecessary_this
    - unnecessary_lambdas
    - sort_child_properties_last
    - sized_box_for_whitespace
    - avoid_unnecessary_containers

    # Correctness — the two rules most directly relevant to a
    # repository-pattern, async-heavy codebase: an ignored Future in a
    # controller is exactly the kind of bug the architecture is designed
    # to prevent.
    - unawaited_futures
    - avoid_returning_null_for_void

    # Formatting/readability discipline.
    - always_declare_return_types
    - avoid_print
    - require_trailing_commas

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
